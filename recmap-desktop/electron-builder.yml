appId: com.recmap.desktoprecorder
productName: RecMap Desktop Recorder
directories:
  output: dist-installer
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/recmap-logo-512.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: RecMap Recorder
  createDesktopShortcut: always
